[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -m "not eval_gate"
markers =
    integration: marks tests that require external services (MLflow, DB, etc.)
    slow: marks tests that are slow (e.g., model downloads)
    verification: marks tests that verify a completed change's acceptance criteria
    eval_gate: marks the retrieval-eval baseline regression gate (needs live DB + embedding backend); excluded from the default run, invoke explicitly with `-m eval_gate`
