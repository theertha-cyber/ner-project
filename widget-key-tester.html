<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Widget Key Tester</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #111; }
  h1 { font-size: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-top: 16px; margin-bottom: 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; font-family: monospace; }
  textarea { min-height: 60px; }
  button { margin-top: 16px; background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  pre { background: #f3f4f6; border-radius: 8px; padding: 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin-top: 20px; font-size: 13px; }
  .status { font-weight: 600; margin-top: 20px; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Widget Key Tester</h1>
  <p class="hint">Hits <code>POST {base}/api/v1/public/chat</code> directly on chat_api using a widget key (<code>ner_widget_...</code>) as bearer token &mdash; no JWT needed.</p>

  <label for="base">chat_api base URL</label>
  <input id="base" value="http://localhost:8006" />

  <label for="key">Widget key</label>
  <input id="key" placeholder="ner_widget_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />

  <label for="msg">Message</label>
  <textarea id="msg">hello</textarea>

  <button id="send">Send</button>

  <div id="status" class="status"></div>
  <pre id="out" style="display:none;"></pre>

<script>
const $ = (id) => document.getElementById(id);

$("send").onclick = async () => {
  const base = $("base").value.trim().replace(/\/$/, "");
  const key = $("key").value.trim();
  const message = $("msg").value;
  const statusEl = $("status");
  const outEl = $("out");

  if (!key) {
    statusEl.textContent = "Enter widget key first.";
    statusEl.className = "status err";
    return;
  }

  $("send").disabled = true;
  statusEl.textContent = "Sending...";
  statusEl.className = "status";
  outEl.style.display = "none";

  const started = performance.now();
  try {
    const resp = await fetch(base + "/api/v1/public/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ message }),
    });
    const ms = Math.round(performance.now() - started);
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    statusEl.textContent = `HTTP ${resp.status} ${resp.ok ? "OK" : ""} (${ms}ms)`;
    statusEl.className = "status " + (resp.ok ? "ok" : "err");
    outEl.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
    outEl.style.display = "block";
  } catch (e) {
    statusEl.textContent = "Connection error: " + e.message + " (check base URL, CORS, chat_api running)";
    statusEl.className = "status err";
  } finally {
    $("send").disabled = false;
  }
};
</script>
</body>
</html>
