# Local Prometheus. Scrapes the eight FastAPI services directly and picks up the two
# Celery workers' metrics from the collector, which is where they arrive over OTLP —
# neither worker runs an HTTP server to scrape.
#
# Ports are the in-network container ports (8000), not the host mappings in
# docker-compose.yml: Prometheus runs on the compose network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ner-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - chat_api:8000
          - document_service:8000
          - extraction_service:8000
          - model_serving:8000
          - training_service:8000
          - annotation_service:8000
          - analytics_service:8000

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
