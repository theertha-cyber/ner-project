# OpenTelemetry Collector for the local stack.
#
# Every process exports here over OTLP and the collector fans the three signals out to
# their backends. That indirection is the point of the design's Decision 1: the
# production backends are blocked behind story 4.5's cloud approval and may change again
# at the SaaS migration, and routing them is a change to this file rather than a
# re-instrumentation of ten services.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounded queueing. A collector that grows without limit under a traffic spike is a
  # second outage on top of the first one.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Scraped by Prometheus at :8889 rather than pushed, so the worker metrics that arrive
  # over OTLP land in the same store as the services' own /metrics endpoints.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
