# Tempo, single-binary, local storage. Sized for a laptop: this exists so the four
# cross-process acceptance criteria are verifiable without the production cluster that
# story 4.5 is blocked on, not to hold retained trace data.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
