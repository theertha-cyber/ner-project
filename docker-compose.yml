version: "3.9"
services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ner
      POSTGRES_PASSWORD: ner
      POSTGRES_DB: ner_dev
    ports:
      # Published on 55432, not 5432. A locally installed PostgreSQL service can bind
      # 5432 as well — Windows permits both — and wins the connections, so a host
      # client (DBeaver, psql, pytest) silently reaches the wrong server and reports
      # "password authentication failed for user ner" with correct credentials.
      # Container-to-container traffic is unaffected: services connect to
      # postgres-test:5432 over the compose network and never use this mapping.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner -d ner_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python -m src.gateway.ensure_mlflow_db && alembic upgrade head && python -m src.gateway.seed && python -m src.gateway.verify_schema"
    restart: "no"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_DATABASE_URL_SYNC: "postgresql://ner:ner@postgres-test:5432/ner_dev"
    depends_on:
      postgres-test:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: deploy/k8s/mlflow/Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://ner:ner@postgres-test:5432/ner_mlflow
      --default-artifact-root s3://ner-platform/mlflow/
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres-test:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_REDIS_URL: "redis://redis:6379/0"
      NER_MINIO_ENDPOINT: "minio:9000"
      NER_DOCUMENT_SERVICE_URL: "http://document_service:8000"
      NER_EXTRACTION_SERVICE_URL: "http://extraction_service:8000"
      NER_MODEL_SERVING_URL: "http://model_serving:8000"
      NER_TRAINING_SERVICE_URL: "http://training_service:8000"
      NER_CHAT_API_PORT: 8006
      NER_CHAT_API_URL: "http://chat_api:8000"
      NER_ANALYTICS_SERVICE_URL: "http://analytics_service:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      chat_api:
        condition: service_started
      training_service:
        condition: service_started

  chat_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.chat_api.main:app --host 0.0.0.0 --port 8000
    # src/chat_api/ (renamed from chat-api for Python import compatibility)
    ports:
      - "8006:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_MODEL_SERVING_URL: "http://model_serving:8000"
      NER_CHAT_API_PORT: 8006
      NER_ENTITY_RESOLUTION_ENABLED: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  document_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.document_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_MINIO_ENDPOINT: "minio:9000"
    depends_on:
      postgres-test:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  extraction_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.extraction_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_DATABASE_URL_SYNC: "postgresql://ner:ner@postgres-test:5432/ner_dev"
      NER_REDIS_URL: "redis://redis:6379/0"
      NER_CELERY_BROKER_URL: "redis://redis:6379/0"
      NER_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      NER_DOCUMENT_SERVICE_URL: "http://document_service:8000"
      NER_MODEL_SERVING_URL: "http://model_serving:8000"
      NER_TRAINING_SERVICE_URL: "http://training_service:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  model_serving:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.model_serving.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8004:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_MINIO_ENDPOINT: "minio:9000"
      NER_MLFLOW_TRACKING_URI: "http://mlflow:5000"
      NER_TRAINING_SERVICE_URL: "http://training_service:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started

  annotation_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.annotation_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8005:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
    depends_on:
      postgres-test:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  training_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.training_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_DATABASE_URL_SYNC: "postgresql://ner:ner@postgres-test:5432/ner_dev"
      NER_REDIS_URL: "redis://redis:6379/0"
      NER_CELERY_BROKER_URL: "redis://redis:6379/0"
      NER_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      NER_MINIO_ENDPOINT: "minio:9000"
      NER_MLFLOW_TRACKING_URI: "http://mlflow:5000"
      ANNOTATION_SERVICE_URL: "http://annotation_service:8000"
      NER_MODEL_SERVING_URL: "http://model_serving:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.training_service.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_DATABASE_URL_SYNC: "postgresql://ner:ner@postgres-test:5432/ner_dev"
      NER_REDIS_URL: "redis://redis:6379/0"
      NER_CELERY_BROKER_URL: "redis://redis:6379/0"
      NER_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      NER_MINIO_ENDPOINT: "minio:9000"
      NER_TRAINING_DEVICE: "cpu"
      NER_MLFLOW_TRACKING_URI: "http://mlflow:5000"
      ANNOTATION_SERVICE_URL: "http://annotation_service:8000"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - .:/app
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  analytics_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.analytics_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8007:8000"
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_ANALYTICS_SERVICE_URL: "http://analytics_service:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  celery_worker_extraction:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.extraction_service.celery_app worker -Q extraction --pool=solo --loglevel=info
    env_file: .env
    environment:
      NER_DATABASE_URL: "postgresql+asyncpg://ner:ner@postgres-test:5432/ner_dev"
      NER_OTLP_ENDPOINT: "otel-collector:4317"
      NER_DATABASE_URL_SYNC: "postgresql://ner:ner@postgres-test:5432/ner_dev"
      NER_REDIS_URL: "redis://redis:6379/0"
      NER_CELERY_BROKER_URL: "redis://redis:6379/0"
      NER_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      NER_DOCUMENT_SERVICE_URL: "http://document_service:8000"
      NER_MODEL_SERVING_URL: "http://model_serving:8000"
      NER_TRAINING_SERVICE_URL: "http://training_service:8000"
    volumes:
      - .:/app
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy
      document_service:
        condition: service_started
      model_serving:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  # --- Local observability stack -------------------------------------------------
  # Four acceptance criteria — a trace spanning two services, a trace extending into a
  # worker, logs joining traces, and collector-down not breaking requests — are not
  # verifiable without somewhere for telemetry to land. Including it here also decouples
  # this change from story 4.5's cloud approval, which is the tracker's only external
  # blocker.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exposition of everything pushed over OTLP
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Local stack only. This is a laptop-scoped viewer over telemetry that already
      # contains no tenant content by construction; it is not exposed off the host.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

  portal:
    build:
      context: src/portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://gateway:8000"
        NEXT_PUBLIC_GATEWAY_URL: "http://localhost:8000"
        NEXT_PUBLIC_DOCUMENT_URL: "http://localhost:8001"
        NEXT_PUBLIC_ANNOTATION_URL: "http://localhost:8005"
        NEXT_PUBLIC_TRAINING_URL: "http://localhost:8003"
        NEXT_PUBLIC_MODEL_SERVING_URL: "http://localhost:8004"
        NEXT_PUBLIC_EXTRACTION_URL: "http://localhost:8002"
        NEXT_PUBLIC_ANALYTICS_URL: "http://localhost:8007"
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_started

volumes:
  minio-data:
  postgres-data:
  tempo-data:
